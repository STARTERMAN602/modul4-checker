name: Evaluasi Modul 4 - Circular List

on:
  push:
  pull_request:

jobs:
  cek-skenario:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Source Code
        uses: actions/checkout@v4

      - name: Kompilasi Program Penguji
        # -fsanitize=address untuk memastikan Skenario 15 bebas dari memory leak
        run: |
          g++ -std=c++17 -Wall -fsanitize=address test.cpp -o checker

      - name: Jalankan Pengujian 13 Skenario
        run: |
          ./checker